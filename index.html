<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spaceship</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Spaceship</h1>

    <p id="game-over" class="hidden">GAME OVER</p>

    <section id="stats"></section>

    <input type="number" name="damage" id="damage-input" />
    <button onclick="takeDamage()">Attack</button>

    <input type="number" name="repair" id="repairkit-input" />
    <button onclick="buyRepairKit();">Buy repair kit</button>
    <button onclick="useRepairKit();">Use repair kit</button>

    <p id="message"></p>

  </body>
  <script src="./script.js"></script>
</html>

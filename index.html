<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spaceship</title>
    <link rel="stylesheet" href="./variables.css" />
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
      <script src="./script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>SPACESHIP<span class="cursor">_</span></h1>

      <p id="game-over" class="hidden">GAME OVER</p>

      <section id="stats"></section>

      <div class="controls">
        <div class="control-group">
          <input type="number" name="damage" id="damage-input" />
          <button onclick="takeDamage()" class="attack">ATTACK</button>
        </div>
        <div class="control-group">
          <input type="number" name="repair" id="repairkit-input" />
          <button onclick="buyRepairKit();">BUY REPAIR KIT</button>
        </div>
        <div class="control-group">
          <input type="number" name="shield" id="shield-input" />
          <button onclick="buyShield();">BUY SHIELD</button>
        </div>
        <div class="control-group">
          <button onclick="useRepairKit();">USE REPAIR KIT</button>
        </div>
      </div>

      <p id="message"></p>
    </main>
  </body>
</html>

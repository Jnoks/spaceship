<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spaceship</title>
    <link rel="stylesheet" href="./variables.css" />
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div class="fight">
      <section class="titan">
        <h1>YOUR SPACESHIP<span class="cursor">_</span></h1>

        <section id="stats"></section>

        <img src="./assets/img/ships/titan.png" alt="" />
      </section>

      <section class="titan">
        <h1>ENEMY SPACESHIP<span class="cursor">_</span></h1>

        <section id="statsEnemy"></section>

        <img class="test" src="./assets/img/ships/enemy01.png" alt="" />
      </section>
    </div>

    <section class="titan">
      <div class="controls">
        <div class="control-group">
          <input type="number" name="repair" id="repairkit-input" />
          <button
            id="buy-repairkit"
            onclick="buyItem('repairKit', 100, 'repairkit-input')"
          >
            BUY REPAIR KIT
          </button>
        </div>
        <div class="control-group">
          <input type="number" name="shield" id="shield-input" />
          <button
            id="buy-shield"
            onclick="buyItem('shield', 50, 'shield-input')"
          >
            BUY SHIELD
          </button>
        </div>
        <div class="control-group">
          <button id="use-repairkit" onclick="useRepairKit()">
            USE REPAIR KIT
          </button>
        </div>
        <div class="control-group">
          <button
            id="attack"
            onclick="takeDamage(enemyAttack())"
            class="attack"
          >
            START FIGHT
          </button>
        </div>
      </div>

      <p id="message"></p>
      <div id="game-over">
        <p>GAME OVER</p>
        <button onclick="reset()">RESET</button>
      </div>
    </section>
  </body>
</html>
